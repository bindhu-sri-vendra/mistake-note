<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mistake Note</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top bar -->
  <header class="topbar">
    <div class="brand">Mistake Note</div>

    <nav class="tabs">
      <button class="tab" data-screen="today">Today</button>
      <button class="tab" data-screen="library">Library</button>
      <button class="tab" data-screen="stats">Stats</button>
    </nav>

    <div class="streak" id="streak">🔥 0 day streak</div>
  </header>

  <main>

    <div id="backup-banner" class="backup-banner" hidden></div>
    <!-- Screen 1: Today -->
    <section id="screen-today" class="screen">
      <button id="add-btn" class="add-btn">+ Add a new card</button>
      <h1>Today</h1>
      <div id="today-area">
        Cards due today will appear here.
      </div>
    </section>

    <!-- Screen 2: Library -->
    <section id="screen-library" class="screen">
      <h1>Library</h1>
      <div id="library-area">
        All your cards will appear here.
      </div>
    </section>

    <!-- Screen 3: Stats -->
    <section id="screen-stats" class="screen">
      <h1>Stats</h1>
      <div id="stats-area">
        Your progress will appear here.
      </div>
    </section>

  </main>
    <!-- Add popup -->
  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h2>Add a card</h2>
        <button type="button" id="modal-close" class="close-btn" aria-label="Close">✕</button>
      </div>

      <div class="type-picker">
        <button type="button" class="type-btn" data-type="vocab">Vocab</button>
        <button type="button" class="type-btn" data-type="grammar">Grammar</button>
        <button type="button" class="type-btn" data-type="mistake">Mistake</button>
      </div>

      <form id="add-form" autocomplete="off">
        <div id="add-fields"></div>
        <p id="add-message" class="add-message"></p>
        <button type="submit" class="save-btn">Save card</button>
        <p class="hint">Press Enter to save · Esc to close</p>
      </form>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
